}

// 增量渲染方法
function renderChat(data, isAppend = true) {
  if (isAppend) {
      // 【修改点 1】：严格拦截过滤：只渲染时间戳大于当前最后一条的消息，完美解决长轮询和发送并发导致的重复Bug
      data = data.filter(msg => msg.Timestamp > lastMsgTime);
  }
  if (data.length === 0) return;

  let body = document.getElementById('chat-body');
  let isScrolledToBottom = body.scrollHeight - body.clientHeight <= body.scrollTop + 50;
  
  if (!isAppend) body.innerHTML = '';
  
  data.forEach(msg => {
// 如果后端传了完整名字就用完整名字，否则退化兼容老版本只显示 ID
    let displayName = msg.SenderName || msg.Sender;
    lastMsgSender = msg.Sender;
    if (msg.Sender && msg.Sender !== myIpId) chatMembers.add(msg.Sender);
    
    // 【修改点】：近期3个发言人中排除掉当前自身
    if (msg.Sender && msg.Sender !== myIpId) {
        recentSpeakers = recentSpeakers.filter(id => id !== msg.Sender);
        recentSpeakers.unshift(msg.Sender);
        if (recentSpeakers.length > 3) recentSpeakers.pop();
    }
    let wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    let isMine = msg.Sender === myIpId;
    wrapper.style.alignItems = isMine ? 'flex-end' : 'flex-start';
    
    let info = document.createElement('div');
    info.style.cssText = 'font-size: 13px; color: #718096; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;';
    
    let textInfoSpan = document.createElement('span');
    let targetInfo = msg.Target ? ` (To:${msg.Target})` : '';
    textInfoSpan.innerText = isMine ? `我 ${msg.Time}${targetInfo}` : `ID:${displayName} ${msg.Time}${targetInfo}`;
    info.appendChild(textInfoSpan);

    // 按钮样式：下沉式，无边框线，背景柔和
    const btnStyle = 'padding: 2px 6px; font-size: 11px; background: #edf2f7; color: #4a5568; border: none; border-radius: 4px; cursor: pointer; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); transition: background 0.2s, transform 0.1s;';
    const noTextStyle = 'padding: 2px 6px; font-size: 11px; background: transparent; color: #cbd5e0; border: none; border-radius: 4px; cursor: default; user-select: none; transition: none;';

    // 复制纯文本按钮
    let btnCopy = document.createElement('button');
    let msgText = getHtmlText(msg.Content); 
    let hasText = msgText.length > 0;

    if (hasText) {
        btnCopy.innerText = '📋 复制文本';
        btnCopy.style.cssText = btnStyle;
        btnCopy.onmousedown = () => btnCopy.style.transform = 'translateY(1px)';
        btnCopy.onmouseup = () => btnCopy.style.transform = 'translateY(0)';
        btnCopy.onclick = (e) => {
            e.stopPropagation();
            let ta = document.createElement('textarea');
            ta.value = msgText; // 使用保留换行的文本提取
            ta.style.position = 'fixed'; ta.style.opacity = '0'; 
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            showToast('✅ 已复制纯文本');
        };
    } else {
        // 无文字内容（如图文等），修改为极简不可点击样式
        btnCopy.innerText = '无文本';
        btnCopy.style.cssText = noTextStyle;
        btnCopy.onclick = (e) => { e.stopPropagation(); }; // 阻止冒泡且无任何反馈
    }
    
    info.appendChild(btnCopy);

    let bubble = document.createElement('div');
    bubble.className = 'chat-bubble ' + (isMine ? 'mine' : 'other');
    bubble.innerHTML = sanitizeChatHtml(msg.Content);
    bubble.style.position = 'relative'; // 开启相对定位以便容纳右侧竖条

    // “查看原HTML”右侧 30px 宽度的可点击竖条 将 height: 100% 改为 top: 0; bottom: 0; 解决绝对定位随内容高度坍塌问题
    let overlayStrip = document.createElement('div');
    overlayStrip.title = '点击查看原HTML/渲染内容';
    overlayStrip.style.cssText = `position: absolute; right: 0; top: 0; bottom: 0; width: 30px; cursor: pointer; background: transparent; transition: background 0.2s; border-top-right-radius: 12px; border-bottom-right-radius: ${isMine ? '2px' : '12px'}; border-top-left-radius: 0; border-bottom-left-radius: 0;`;
    overlayStrip.onmouseover = () => overlayStrip.style.background = 'rgba(0,0,0,0.06)';
    overlayStrip.onmouseout = () => overlayStrip.style.background = 'transparent';
    overlayStrip.onclick = (e) => {
        e.stopPropagation();
        openModalWithContent(msg.Content); // 调用全局统一弹窗函数
    };
    bubble.appendChild(overlayStrip);


    // 【修改点2】：单条消息高度限制：超过600px自动折叠显示500px，底部加上可点击的“已被折叠”提醒（等同于查看原HTML）
    // 先将 bubble 临时加入 DOM 树以准确测量真实高度
    body.appendChild(wrapper);
    wrapper.appendChild(info);
    wrapper.appendChild(bubble);
    
    // 强制渲染计算高度
    let measuredHeight = bubble.offsetHeight;
    if (measuredHeight > 600) {
        bubble.style.maxHeight = '500px';
        bubble.style.overflow = 'hidden';
        bubble.style.position = 'relative';

        let foldTip = document.createElement('div');
        foldTip.innerText = '已被折叠 (点击查看原HTML/完整内容)';
        foldTip.style.cssText = 'position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(240,240,240,0.95) 70%); text-align: center; padding: 25px 0 10px 0; font-size: 12px; color: #3182ce; font-weight: bold; cursor: pointer; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; z-index: 2;';
        // 【修改】点击折叠提示时直接调用统一弹窗函数
        foldTip.onclick = (e) => {
            e.stopPropagation();
            openModalWithContent(msg.Content);
        };
        bubble.appendChild(foldTip);
    }

    bubble.querySelectorAll('img').forEach(img => {
        img.style.cursor = 'pointer'; 
        img.onclick = (e) => {
            e.stopPropagation();
            if (typeof openGallery === 'function') openGallery(img.src, true);
        };
    });
  });
  
  if (typeof renderMembers === 'function') renderMembers();

  if (data.length > 0) {
      let lastMsg = data[data.length - 1];
      lastMsgTime = lastMsg.Timestamp;
      // 【修复】：实时计算末条消息是否包含文本
      lastMsgHasText = getHtmlText(lastMsg.Content).length > 0;
      
      let bubbleEl = document.getElementById('new-msg-bubble');
      let countEl = document.getElementById('new-msg-count');

      if (isScrolledToBottom || !isAppend) {
          body.scrollTop = body.scrollHeight;
          if (bubbleEl) bubbleEl.style.display = 'none';
          pendingNewMsgs = 0;

          // 【新增】：在消息量少（无滚动条）或自动滚动到底部时，正确触发“复制末条”按钮的显示判定
          let btnCopyLast = document.getElementById('btn-copy-last');
          if (btnCopyLast) {
              if (lastMsgSender && lastMsgSender !== myIpId && lastMsgHasText) {
                  btnCopyLast.style.display = 'block';
              } else {
                  btnCopyLast.style.display = 'none';
              }
          }
      } else {
          pendingNewMsgs += data.length;
          if (countEl) countEl.innerText = pendingNewMsgs;
          if (bubbleEl) bubbleEl.style.display = 'block';
      }
  }
updateRecentTargetsUI();
}

async function sendChat() {
    const input = document.getElementById('chat-input');
    const target = document.getElementById('chat-target').value;
    
    if (input.querySelector('img[title="正在上传图片..."]')) {
        showToast('⏳ 请等待图片上传完成后再发送');
        return;
    }

    const content = input.innerHTML;
    const textContent = input.innerText;
    const hasImg = input.querySelector('img') !== null;
    
    if(!textContent && !hasImg) return;
    
    input.innerHTML = '';
    try {
        // 请求同时附上当前最后的拉取时间，顺带把发送的与其他人发送的差异更新拉取回来
        const res = await fetch(`${SERVER_URL}chat/send?a=${encodeURIComponent(target)}&last=${lastMsgTime}&c=0`, {
            method: 'POST',
            body: content
        });
        const newData = await res.json();
        if (newData && newData.length > 0) {
            renderChat(newData, true); 
            scrollToChatBottom(); // 只要是自己发了消息，强制锁定并滚动到底部
        }
    } catch(e) { showToast('发送失败'); }
}

// 统一封装或修改打开弹窗赋初值的逻辑（确保每次打开默认为渲染模式）：
function openModalWithContent(rawContent) {
    currentModalRawContent = rawContent;
    modalIsRenderMode = true; // 默认渲染显示作为初始状态
    
    let modal = document.getElementById('msg-modal');
    let textEl = document.getElementById('msg-modal-text');
    let renderEl = document.getElementById('msg-modal-render-view');
    let toggleBtn = document.getElementById('modal-btn-toggle-render');
    let titleEl = document.getElementById('msg-modal-title');

    renderEl.innerHTML = sanitizeChatHtml(currentModalRawContent);
    renderEl.querySelectorAll('img').forEach(img => {
        img.style.cursor = 'pointer';
        img.onclick = (e) => {
            e.stopPropagation();
            if (typeof openGallery === 'function') openGallery(img.src, true);
        };
    });

    textEl.style.display = 'none';
    renderEl.style.display = 'block';
    toggleBtn.innerText = '切换查看代码';
    titleEl.innerText = '消息内容 (HTML渲染模式)';

track.addEventListener('touchstart', e => {
  if (e.touches.length > 1) return;
  if (isAnimating) { clearTimeout(animTimer); isAnimating = false; }
  isDragging = true;
  startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  track.style.transition = 'none';
});
track.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const diffX = e.touches[0].clientX - startX;
  const diffY = e.touches[0].clientY - startY;
  if (Math.abs(diffX) > Math.abs(diffY)) {
    track.style.transform = `translateX(calc(-100vw + ${diffX}px))`;
  } else if (diffY > 0) {
    track.style.transform = `translateX(-100vw) translateY(${diffY}px)`;
  }
});
track.addEventListener('touchend', e => {
  if (!isDragging) return; isDragging = false;
  const diffX = e.changedTouches[0].clientX - startX;
  const diffY = e.changedTouches[0].clientY - startY;
  if (diffY > 80 && Math.abs(diffX) < 100) {
    closeGallery(e, true); return;
  }
  if (Math.abs(diffX) < 8 && Math.abs(diffY) < 8) {
    const now = Date.now();
    if (now - lastTapTime < 300) { closeGallery(e, true); return; }
    lastTapTime = now;
    if (e.target.id === 'lightbox' || e.target.classList.contains('lb-slide')) {
      closeGallery(e, true); return;
    }
    return;
  }
  const threshold = window.innerWidth / 4;
  if (diffX > threshold) changeImg(-1);
  else if (diffX < -threshold) changeImg(1);
  else {
    isAnimating = true;
    animTimer = setTimeout(() => { isAnimating = false; }, 350);
    track.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
    track.style.transform = 'translateX(-100vw)';
    track.addEventListener('transitionend', function handler() {
      track.removeEventListener('transitionend', handler);
      clearTimeout(animTimer); isAnimating = false;
    });
  }
});
track.addEventListener('touchcancel', () => {
  isDragging = false; isAnimating = false;
  if(animTimer) clearTimeout(animTimer);
});

// 打开媒体画廊（过滤只包含音视频）
function openMediaGallery(mediaUrl, ext, fileName, token) {
    currentGalleryMode = 'media';
    
    // 构建仅包含媒体文件的播放列表
    mediaList = [];
    const mediaExts = ['mp4', 'webm', 'flac', 'mp3', 'wav', 'aac', 'm4a', 'ogg'];
    const rows = document.querySelectorAll('#file-list-body tr.file-row');

    rows.forEach(row => {
        const name = row.dataset.name || '';
        const fExt = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
        if (mediaExts.includes(fExt)) {
            const link = row.querySelector('.gallery-link');
            const previewImg = row.querySelector('img.preview');
            
            let url = '';
            let itemToken = row.dataset.token || ''; // 优先读取 row 上的 dataset.token
            
            if (link) {
                const onclickStr = link.getAttribute('onclick') || '';
                // 兼容解析 openMediaGallery('url', 'ext', 'name', 'token')
                const match = onclickStr.match(/openMediaGallery\s*\(\s*'([^']*)'(?:\s*,\s*'([^']*)')?(?:\s*,\s*'([^']*)')?(?:\s*,\s*'([^']*)')?\s*\)/);
                if (match) {
                    url = match[1] || '';
                    if (match[4]) itemToken = match[4]; // 提取第 4 个参数 token
                }
            }

            // 若正则没提取到且正是当前项，使用传入的 token 作为保底
            if (!itemToken && url === mediaUrl) {
                itemToken = token || '';
            }

            if (url) {
                mediaList.push({
                    url: url,
                    ext: fExt,
                    name: name,
                    token: itemToken || token || 'default',
                    thumbId: previewImg ? previewImg.id : null
                });
            }
        }
    });

    currentMediaIndex = mediaList.findIndex(m => m.url === mediaUrl);
    if (currentMediaIndex === -1) {
        mediaList = [{ url: mediaUrl, ext: ext, name: fileName, token: token || 'default', thumbId: null }];
        currentMediaIndex = 0;
    }

    // 显隐控件
    document.getElementById('lb-track').style.display = 'none';
    document.getElementById('lb-rotate-btn').style.display = 'none';
    document.getElementById('lb-media-box').style.display = 'flex';
    document.getElementById('lb-media-controls').style.display = 'flex';

    document.getElementById('lightbox').style.display = 'block';
    
    // 初始化循环模式 UI
    toggleLoopMode(currentLoopMode);

    playMediaItem(currentMediaIndex);
updateLoopUI();
pushGalleryHistoryState();
}

        const cache = globalMediaCache[item.url];
        if (cache) {
            coverEl.src = cache.coverUrl;
            
            // 当解析到的图片超过 1 张时，启动 5 秒定时轮播
            if (cache.pictureUrls && cache.pictureUrls.length > 1) {
                let picIndex = 0;
                coverCycleTimer = setInterval(() => {
                    picIndex = (picIndex + 1) % cache.pictureUrls.length;
                    const picObj = cache.pictureUrls[picIndex];
                    coverEl.src = (typeof picObj === 'object' && picObj.url) ? picObj.url : picObj;
                }, 5000);

            if (cache.title && cache.artist) {
          const displayTitle = cache.title +' '+ item.ext;
          titleEl.innerText = ` ${displayTitle}  ${cache.artist}`;
          }
        } else {
            // 如果缓存不存在，兜底使用默认图标
            coverEl.src = defaultMusicIcon;

// 缩略图生成与数据获取 
async function lazyGenerateMediaThumb(url, ext, thumbId, fileName) {
    const imgEl = document.getElementById(thumbId);
    const isVideo = ['mp4', 'webm'].includes(ext);
    const isAudio = ['flac', 'mp3', 'wav', 'aac', 'm4a', 'ogg', 'ape'].includes(ext);

    // 命中缓存则直接复用
    if (globalMediaCache[url] && imgEl && !isVideo) {
        imgEl.src = globalMediaCache[url].coverUrl;
        return;
    }

    if (isVideo) {
        const v = document.createElement('video');
        v.src = url;
        v.muted = true;
        v.playsInline = true;
        v.currentTime = 2; // 提取第2秒的画面
        v.addEventListener('seeked', () => {
            try {
                const canvas = document.createElement('canvas');
                // 缩小尺寸，仅作为列表缩略图
                canvas.width = v.videoWidth / 4; 
                canvas.height = v.videoHeight / 4;
                canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
                imgEl.src = canvas.toDataURL('image/jpeg', 0.5);
            } catch (e) { console.warn("跨域拦截无法生成缩略图"); }
        }, { once: true });
        return; 
    }

 if (isAudio) {
try {
        let combinedBuffer;
        const FIVE_MB = 5 * 1024 * 1024;
        const ONE_MB = 1 * 1024 * 1024;

        let fileSize = 0;

        // 1. 先通过 HEAD 请求准确获取文件总大小
        try {
            const headResp = await fetch(url, { method: 'HEAD' });
            if (headResp.ok) {
                const contentLength = headResp.headers.get('content-length');
                if (contentLength) {
                    fileSize = parseInt(contentLength, 10);
                }
            }
        } catch (e) {
            console.warn("HEAD 请求被拦截或不支持，将回退到默认获取模式", e);
        }

        // 2. 根据文件大小采取最安全的数据获取策略
        if (fileSize > 0 && fileSize <= FIVE_MB) {
            // 【小文件最佳路径】：文件 <= 5MB，直接发起普通 GET 请求获取完整文件
            // 不携带 Range 头，行为与本地 HTML 读取 File 完全一致！
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP Error: ${resp.status}`);
            combinedBuffer = await resp.arrayBuffer();

        } else if (fileSize > FIVE_MB) {
            // 【大文件优化路径】：已知文件 > 5MB，分别拉取头部 5MB 和尾部 1MB 进行拼接
            const [headResp, tailResp] = await Promise.all([
                fetch(url, { headers: { Range: `bytes=0-${FIVE_MB - 1}` } }),
                fetch(url, { headers: { Range: `bytes=${fileSize - ONE_MB}-${fileSize - 1}` } })
            ]);

            if (headResp.ok && tailResp.ok) {
                const headBuffer = await headResp.arrayBuffer();
                const tailBuffer = await tailResp.arrayBuffer();

                const merged = new Uint8Array(headBuffer.byteLength + tailBuffer.byteLength);
                merged.set(new Uint8Array(headBuffer), 0);
                merged.set(new Uint8Array(tailBuffer), headBuffer.byteLength);
                combinedBuffer = merged.buffer;
            } else {
                // 若 Range 分段请求失败，降级为拉取全量文件
                const fullResp = await fetch(url);
                combinedBuffer = await fullResp.arrayBuffer();
            }

        } else {
            // 【未拿到大小的兜底路径】：HEAD 被跨域限制时，直接发起一次普通全量 GET 请求
            const fullResp = await fetch(url);
            if (!fullResp.ok) throw new Error(`HTTP Error: ${fullResp.status}`);
            combinedBuffer = await fullResp.arrayBuffer();
        }

        // 3. 传入拼接或完整读取后的 ArrayBuffer 提取元数据分别拉取头部 5MB 和尾部 1MB 进行拼接
        const meta = extractMetadataFromBuffer(combinedBuffer);

            // 将所有提取出的图片转换成 Blob URL 列表
            let pictureUrls = meta.pictures.map(p => ({
                url: URL.createObjectURL(p.blob),
                typeCode: p.typeCode,
                typeName: p.typeName
            }));

            // 取首个图片做主封面
            let coverUrl = pictureUrls.length > 0 ? pictureUrls[0].url : null;
            
            // 兜底逻辑
            if (!coverUrl) coverUrl = findLocalImageFallback(url, fileName);
            if (!coverUrl) coverUrl = defaultMusicIcon;
            
            // 写入全局缓存（coverUrl 保持指向第一张图，pictureUrls 保存完整的图片数组）
            globalMediaCache[url] = { 
                coverUrl: coverUrl, 
                pictureUrls: pictureUrls.length > 0 ? pictureUrls : [{ url: coverUrl, typeCode: 3, typeName: '封面' }],
                artist: meta.artist, 
                title: meta.title 
            };

            if (imgEl) imgEl.src = coverUrl;

            // 若当前媒体刚好处于正在播放状态，UIupdateActiveGalleryMeta(url);自动热更新
            
        } catch (e) {
            const fallbackUrl = findLocalImageFallback(url, fileName) || defaultMusicIcon;
            globalMediaCache[url] = { coverUrl: fallbackUrl, artist: '', title: '' };
            if (imgEl) imgEl.src = fallbackUrl;
        }
    }
}


// 辅助功能：轻量级二进制元数据读取 (支持 ID3v2/MP3/WAV, FLAC, M4A/AAC/MP4)
/**
 * 从 ArrayBuffer 中提取元数据及所有内嵌图片（支持 MP3/FLAC/WAV/APE/M4A）
 * @param {ArrayBuffer} buffer 
 * @returns { { pictures: Array, coverBlob: Blob|null, artist: string, title: string } }
 */
// 标准 ID3v2 / FLAC 图像类型定义映射表
const PICTURE_TYPES = {
    0: '其他图片', 1: '32x32 图标', 2: '其他图标', 3: '封面 (Front)', 4: '封底 (Back)',
    5: '宣传折页', 6: 'CD/盘面', 7: '领唱/主奏', 8: '歌手/艺人', 9: '指挥家',
    10: '乐队/合奏组', 11: '作曲家', 12: '作词人', 13: '录音场地', 14: '录音现场',
    15: '演出现场', 16: '画面截图', 17: '插画', 18: '艺人标志', 19: '出版商标志'
};

/**
 * 从 ArrayBuffer 中提取元数据及所有内嵌图片（支持 MP3/FLAC/WAV/APE/M4A）
 * @param {ArrayBuffer} buffer 
 * @returns { { pictures: Array, coverBlob: Blob|null, artist: string, title: string } }
 */
function extractMetadataFromBuffer(buffer) {
    let pictures = [], artist = '', title = '';
    const uint8 = new Uint8Array(buffer);
    const view = new DataView(buffer);
    const decoder = new TextDecoder('utf-8');

    // 辅助解析：ID3v2 标签（支持 MP3, WAV 内嵌 ID3 等）
    function parseID3v2(dataBuffer) {
        if (!dataBuffer || dataBuffer.byteLength < 10) return { found: false, title: '', artist: '', pictures: [] };
        const u8 = new Uint8Array(dataBuffer);
        let t = '', a = '', pics = [], found = false;

        // 1. 动态扫描 "ID3" 头部 (0x49, 0x44, 0x33)，防止头部有填充字节
        let id3Start = -1;
        for (let i = 0; i <= u8.length - 10; i++) {
            if (u8[i] === 0x49 && u8[i + 1] === 0x44 && u8[i + 2] === 0x33) {
                id3Start = i;
                break;
            }
        }

        if (id3Start !== -1) {
            found = true;
            const major = u8[id3Start + 3];
            const id3Size = ((u8[id3Start + 6] & 0x7F) << 21) |
                            ((u8[id3Start + 7] & 0x7F) << 14) |
                            ((u8[id3Start + 8] & 0x7F) << 7) |
                             (u8[id3Start + 9] & 0x7F);
            const limit = Math.min(id3Start + 10 + id3Size, u8.length);
            let offset = id3Start + 10;

            const decodeText = (subArray, encoding) => {
                let label = 'utf-8';
                if (encoding === 0) label = 'iso-8859-1';
                else if (encoding === 1) label = 'utf-16';
                else if (encoding === 2) label = 'utf-16be';
                else if (encoding === 3) label = 'utf-8';
                try {
                    return new TextDecoder(label).decode(subArray).replace(/\0/g, '').trim();
                } catch (e) { return ''; }
            };

            while (offset < limit - 10) {
                if (u8[offset] === 0) break; // 空字节填充结束

                const frameId = String.fromCharCode(u8[offset], u8[offset + 1], u8[offset + 2], u8[offset + 3]);
                let frameSize = (major === 4) ?
                    (((u8[offset + 4] & 0x7F) << 21) | ((u8[offset + 5] & 0x7F) << 14) | ((u8[offset + 6] & 0x7F) << 7) | (u8[offset + 7] & 0x7F)) :
                    (((u8[offset + 4] << 24) | (u8[offset + 5] << 16) | (u8[offset + 6] << 8) | u8[offset + 7]) >>> 0);

                if (frameSize <= 0 || offset + 10 + frameSize > u8.length) break;

                const fStart = offset + 10;
                const fEnd = fStart + frameSize;

                // --- APIC (封面/多图片提取) ---
                if (frameId === 'APIC') {
                    let pOff = fStart;
                    const textEnc = u8[pOff++];

                    // 1. 读取 MIME Type (\0 结尾)
                    let mEnd = pOff;
                    while (mEnd < fEnd && u8[mEnd] !== 0) mEnd++;
                    let mimeType = new TextDecoder('iso-8859-1').decode(u8.subarray(pOff, mEnd)).trim();
                    pOff = mEnd + 1;

                    if (!mimeType || mimeType === '-->') mimeType = 'image/jpeg';
                    else if (mimeType.toLowerCase() === 'png') mimeType = 'image/png';
                    else if (mimeType.toLowerCase() === 'jpg' || mimeType.toLowerCase() === 'jpeg') mimeType = 'image/jpeg';

                    // 2. 读取 Picture Type (1 字节)
                    const picTypeCode = u8[pOff++];

                    // 3. 跳过 Description
                    if (textEnc === 1 || textEnc === 2) {
                        while (pOff < fEnd - 1) {
                            if (u8[pOff] === 0 && u8[pOff + 1] === 0) { pOff += 2; break; }
                            pOff += 2;
                        }
                    } else {
                        while (pOff < fEnd && u8[pOff] !== 0) pOff++;
                        pOff++;
                    }

                    // 4. 收集图片 Binary
                    if (pOff < fEnd) {
                        pics.push({
                            blob: new Blob([u8.subarray(pOff, fEnd)], { type: mimeType }),
                            typeCode: picTypeCode,
                            typeName: (typeof PICTURE_TYPES !== 'undefined' && PICTURE_TYPES[picTypeCode]) ? PICTURE_TYPES[picTypeCode] : '封面/图片'
                        });
                    }
                } 
                // --- 文本标签 ---
                else if (frameId === 'TIT2') {
                    t = decodeText(u8.subarray(fStart + 1, fEnd), u8[fStart]);
                } else if (frameId === 'TPE1') {
                    a = decodeText(u8.subarray(fStart + 1, fEnd), u8[fStart]);
                }

                offset += 10 + frameSize;
            }
        }
        return { found, title: t, artist: a, pictures: pics };
    }

    // 辅助解析 APEv2 标签 (获取尾部封面数据)
    function parseAPETag(dataBuffer) {
        if (!dataBuffer) return { found: false };
        const u8 = new Uint8Array(dataBuffer);
        const v = new DataView(dataBuffer);
        const magic = [0x41, 0x50, 0x45, 0x54, 0x41, 0x47, 0x45, 0x58]; // "APETAGEX"
        
        let pos = -1;
        for (let i = u8.length - 32; i >= 0; i--) {
            let match = true;
            for (let j = 0; j < 8; j++) {
                if (u8[i + j] !== magic[j]) { match = false; break; }
            }
            if (match) { pos = i; break; }
        }
        if (pos === -1) return { found: false };

        const tagSize = v.getUint32(pos + 12, true);
        const itemCount = v.getUint32(pos + 16, true);
        const flags = v.getUint32(pos + 20, true);
        const isHeader = (flags & 0x20000000) !== 0;

        let itemOffset = isHeader ? (pos + 32) : Math.max(0, pos + 32 - tagSize);
        let t = '', a = '', pics = [];

        for (let i = 0; i < itemCount; i++) {
            if (itemOffset + 8 > u8.length) break;
            const valLen = v.getUint32(itemOffset, true);
            const itemFlags = v.getUint32(itemOffset + 4, true);
            const isBinary = ((itemFlags >> 1) & 0x03) === 1;

            let keyEnd = itemOffset + 8;
            while (keyEnd < u8.length && u8[keyEnd] !== 0) keyEnd++;
            if (keyEnd >= u8.length) break;

            const key = new TextDecoder('ascii').decode(u8.subarray(itemOffset + 8, keyEnd)).toUpperCase();
            const valStart = keyEnd + 1;
            const valEnd = valStart + valLen;
            if (valEnd > u8.length) break;

            if (isBinary) {
                if (key.includes('COVER ART')) {
                    let imgStart = valStart;
                    while (imgStart < valEnd && u8[imgStart] !== 0) imgStart++;
                    imgStart++; 
                    if (imgStart < valEnd) {
                        const typeCode = key.includes('BACK') ? 4 : 3;
                        pics.push({
                            blob: new Blob([u8.subarray(imgStart, valEnd)], { type: 'image/jpeg' }),
                            typeCode: typeCode,
                            typeName: (typeof PICTURE_TYPES !== 'undefined' && PICTURE_TYPES[typeCode]) ? PICTURE_TYPES[typeCode] : key
                        });
                    }
                }
            } else {
                const valText = decoder.decode(u8.subarray(valStart, valEnd)).trim();
                if (key === 'TITLE') t = valText;
                else if (key === 'ARTIST') a = valText;
            }
            itemOffset = valEnd;
        }
        return { found: true, title: t, artist: a, pictures: pics };
    }

    try {
        let hasTags = false;

        // 1. FLAC 格式解析
        if (uint8[0] === 0x66 && uint8[1] === 0x4C && uint8[2] === 0x61 && uint8[3] === 0x43) { 
            hasTags = true;
            let offset = 4;
            while (offset < uint8.length - 4) {
                const header = view.getUint32(offset, false);
                const isLast = (header & 0x80000000) !== 0;
                const blockType = (header >> 24) & 0x7F;
                const length = header & 0x00FFFFFF;
                const blockStart = offset + 4;

                if (blockType === 6) { // PICTURE
                    let pOffset = blockStart;
                    const picTypeCode = view.getUint32(pOffset, false); pOffset += 4;
                    const mimeLen = view.getUint32(pOffset, false); pOffset += 4;
                    const mimeType = decoder.decode(uint8.subarray(pOffset, pOffset + mimeLen)); pOffset += mimeLen;
                    const descLen = view.getUint32(pOffset, false); pOffset += 4 + descLen + 16;
                    const picDataLen = view.getUint32(pOffset, false); pOffset += 4;
                    
                    pictures.push({
                        blob: new Blob([uint8.subarray(pOffset, pOffset + picDataLen)], { type: mimeType || 'image/jpeg' }),
                        typeCode: picTypeCode,
                        typeName: (typeof PICTURE_TYPES !== 'undefined' && PICTURE_TYPES[picTypeCode]) ? PICTURE_TYPES[picTypeCode] : '图片'
                    });
                } else if (blockType === 4) { // VORBIS_COMMENT
                    let cOffset = blockStart;
                    const vendorLen = view.getUint32(cOffset, true); cOffset += 4 + vendorLen;
                    const commentListLen = view.getUint32(cOffset, true); cOffset += 4;
                    
                    for (let i = 0; i < commentListLen; i++) {
                        if (cOffset + 4 > blockStart + length) break;
                        const commentLen = view.getUint32(cOffset, true); cOffset += 4;
                        if (cOffset + commentLen > blockStart + length) break;
                        
                        const comment = decoder.decode(uint8.subarray(cOffset, cOffset + commentLen));
                        cOffset += commentLen;
                        const eqIdx = comment.indexOf('=');
                        if (eqIdx !== -1) {
                            const key = comment.slice(0, eqIdx).toUpperCase();
                            const val = comment.slice(eqIdx + 1);
                            if (key === 'TITLE') title = val;
                            if (key === 'ARTIST') artist = val;
                        }
                    }
                }
                offset += 4 + length;
                if (isLast) break;
            }
        } 
        // 2. WAV 格式解析（RIFF ... WAVE 结构）
        else if (
            uint8.length >= 12 &&
            uint8[0] === 0x52 && uint8[1] === 0x49 && uint8[2] === 0x46 && uint8[3] === 0x46 && // "RIFF"
            uint8[8] === 0x57 && uint8[9] === 0x41 && uint8[10] === 0x56 && uint8[11] === 0x45  // "WAVE"
        ) {
            hasTags = true;
            let offset = 12;
            let foundInLoop = false;

            // --- 阶段 A：尝试标准 RIFF 链表遍历 ---
            while (offset < uint8.length - 8) {
                const chunkId = String.fromCharCode(uint8[offset], uint8[offset + 1], uint8[offset + 2], uint8[offset + 3]);
                const chunkSize = view.getUint32(offset + 4, true); // 小端序
                const cStart = offset + 8;

                // 若 chunk 声明大小超出了拼接后的 buffer 长度（如 data 块声明了 38MB 但缓存仅 6MB），中断线性遍历
                if (chunkSize <= 0 || cStart + chunkSize > uint8.length) {
                    break;
                }

                // 1) 解析 WAV 内嵌的 id3 块
                if (chunkId.toLowerCase() === 'id3 ') {
                    const id3SubArray = uint8.subarray(cStart, cStart + chunkSize);
                    const id3Res = parseID3v2(id3SubArray);
                    if (!title && id3Res.title) title = id3Res.title;
                    if (!artist && id3Res.artist) artist = id3Res.artist;
                    if (id3Res.pictures.length > 0) {
                        pictures.push(...id3Res.pictures);
                        foundInLoop = true;
                    }
                } 
                // 2) 解析 RIFF LIST INFO 块
                else if (chunkId === 'LIST') {
                    const listType = String.fromCharCode(uint8[cStart], uint8[cStart + 1], uint8[cStart + 2], uint8[cStart + 3]);
                    if (listType === 'INFO') {
                        let lOffset = cStart + 4;
                        const lEnd = cStart + chunkSize;
                        while (lOffset < lEnd - 8) {
                            const subId = String.fromCharCode(uint8[lOffset], uint8[lOffset + 1], uint8[lOffset + 2], uint8[lOffset + 3]);
                            const subSize = view.getUint32(lOffset + 4, true);
                            const subStart = lOffset + 8;
                            if (subSize <= 0 || subStart + subSize > lEnd) break;

                            const subText = decoder.decode(uint8.subarray(subStart, subStart + subSize)).replace(/\0/g, '').trim();
                            if (subId === 'INAM' && !title) title = subText;
                            else if (subId === 'IART' && !artist) artist = subText;

                            lOffset += 8 + subSize + (subSize % 2);
                        }
                        if (title || artist) foundInLoop = true;
                    }
                }
                offset += 8 + chunkSize + (chunkSize % 2); // RIFF 偶数字节对齐
            }

            // --- 阶段 B：容错兜底（针对 Head+Tail 抽样拼接导致的指针截断）---
            if (!foundInLoop || pictures.length === 0) {
                for (let i = 0; i < uint8.length - 12; i++) {
                    // 1. 全局扫描 "id3 " 或 "ID3 " 标记
                    if ((uint8[i] === 0x69 || uint8[i] === 0x49) && 
                        (uint8[i+1] === 0x64 || uint8[i+1] === 0x44) && 
                        uint8[i+2] === 0x33 && uint8[i+3] === 0x20) {
                        const subSize = view.getUint32(i + 4, true);
                        const id3Start = i + 8;
                        const id3End = Math.min(id3Start + subSize, uint8.length);
                        if (id3Start < uint8.length) {
                            const id3Res = parseID3v2(uint8.subarray(id3Start, id3End));
                            if (!title && id3Res.title) title = id3Res.title;
                            if (!artist && id3Res.artist) artist = id3Res.artist;
                            if (id3Res.pictures.length > 0) pictures.push(...id3Res.pictures);
                        }
                    }
                    // 2. 全局扫描 "LIST" 且带有 "INFO" 的标记
                    else if (uint8[i] === 0x4C && uint8[i+1] === 0x49 && uint8[i+2] === 0x53 && uint8[i+3] === 0x54 &&
                             uint8[i+8] === 0x49 && uint8[i+9] === 0x4E && uint8[i+10] === 0x46 && uint8[i+11] === 0x4F) {
                        const listSize = view.getUint32(i + 4, true);
                        let lOffset = i + 12;
                        const lEnd = Math.min(i + 8 + listSize, uint8.length);
                        while (lOffset < lEnd - 8) {
                            const subId = String.fromCharCode(uint8[lOffset], uint8[lOffset + 1], uint8[lOffset + 2], uint8[lOffset + 3]);
                            const subSize = view.getUint32(lOffset + 4, true);
                            const subStart = lOffset + 8;
                            if (subSize <= 0 || subStart + subSize > lEnd) break;

                            const subText = decoder.decode(uint8.subarray(subStart, subStart + subSize)).replace(/\0/g, '').trim();
                            if (subId === 'INAM' && !title) title = subText;
                            else if (subId === 'IART' && !artist) artist = subText;

                            lOffset += 8 + subSize + (subSize % 2);
                        }
                    }
                }
            }
        }
        // 3. ID3v2 (MP3) 格式解析
        else if (uint8[0] === 0x49 && uint8[1] === 0x44 && uint8[2] === 0x33) {
            const id3Res = parseID3v2(buffer);
            hasTags = id3Res.found;
            if (id3Res.title) title = id3Res.title;
            if (id3Res.artist) artist = id3Res.artist;
            if (id3Res.pictures.length > 0) pictures = id3Res.pictures;
        }
        // 4. M4A / MP4 (AAC) 格式解析
        else if (uint8.length > 8 && ['ftyp', 'moov', 'mdat', 'free', 'skip', 'wide'].includes(String.fromCharCode(uint8[4], uint8[5], uint8[6], uint8[7]))) {
            hasTags = true;
            let offset = 0;
            while (offset < uint8.length - 8) {
                let size = (uint8[offset] << 24) | (uint8[offset + 1] << 16) | (uint8[offset + 2] << 8) | uint8[offset + 3];
                let type = String.fromCharCode(uint8[offset + 4], uint8[offset + 5], uint8[offset + 6], uint8[offset + 7]);
                if (size === 0) break;
                if (['moov', 'udta', 'meta', 'ilst'].includes(type)) {
                    offset += (type === 'meta' ? 12 : 8); 
                    continue;
                }
                if (type === 'covr') { 
                    let dOff = offset + 8;
                    let dSize = (uint8[dOff] << 24) | (uint8[dOff + 1] << 16) | (uint8[dOff + 2] << 8) | uint8[dOff + 3];
                    if (String.fromCharCode(uint8[dOff + 4], uint8[dOff + 5], uint8[dOff + 6], uint8[dOff + 7]) === 'data') {
                        pictures.push({
                            blob: new Blob([uint8.subarray(dOff + 16, dOff + dSize)], { type: 'image/jpeg' }),
                            typeCode: 3,
                            typeName: '封面 (Front)'
                        });
                    }
                } else if (type === '©ART') { 
                    artist = decoder.decode(uint8.subarray(offset + 24, offset + size));
                } else if (type === '©nam') { 
                    title = decoder.decode(uint8.subarray(offset + 24, offset + size));
                }
                offset += size;
            }
        }

        // 5. 保底 APE Tag 扫描机制
        if (!hasTags || pictures.length === 0 || !title || !artist) {
            const apeRes = parseAPETag(buffer);
            if (apeRes && apeRes.found) {
                if (!title && apeRes.title) title = apeRes.title;
                if (!artist && apeRes.artist) artist = apeRes.artist;
                if (apeRes.pictures.length > 0) {
                    pictures.push(...apeRes.pictures);
                }
            }
        }
    } catch (e) { 
        console.warn("Meta extract skipped:", e); 
    }

    // 智能排序：优先将 Front Cover (typeCode=3) 放在首位
    if (pictures.length > 1) {
        pictures.sort((a, b) => {
            if (a.typeCode === 3) return -1;
            if (b.typeCode === 3) return 1;
            if (a.typeCode === 4) return -1;
            if (b.typeCode === 4) return 1;
            return 0;
        });
    }

    return { 
        pictures, 
        coverBlob: pictures.length > 0 ? pictures[0].blob : null, 
        artist, 
        title 
    };
}

// 辅助功能：本地图片兜底查找 (同名图片或同文件夹名图片)
function findLocalImageFallback(fileUrl, fileName) {
    const fileEntry = filesData.find(f => f.url === fileUrl || f.name === fileName);
    if (!fileEntry) return null;
    
    // 兼容不同操作系统的斜杠
    const sep = fileEntry.path.includes('\\') ? '\\' : '/'; 
    const dirPath = fileEntry.path.substring(0, fileEntry.path.lastIndexOf(sep) + 1);
    if (!dirPath) return null;
    
    const dirParts = dirPath.split(sep).filter(Boolean);
    const dirName = dirParts.length > 0 ? dirParts[dirParts.length - 1] : '';
    const nameWithoutExt = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
    const imgExts = ['ico','jpe','jpeg','jpg','pcx','png','bmp','gif','webp','svg'];
    
    // 1. 同名图片
    let cover = filesData.find(f => !f.isDir && f.path.startsWith(dirPath) && 
        imgExts.includes(f.name.split('.').pop().toLowerCase()) && 
        f.name.substring(0, f.name.lastIndexOf('.')) === nameWithoutExt);
        
    // 2. 文件夹名同名图片
    if (!cover && dirName) {
        cover = filesData.find(f => !f.isDir && f.path.startsWith(dirPath) && 
        imgExts.includes(f.name.split('.').pop().toLowerCase()) && 
        f.name.substring(0, f.name.lastIndexOf('.')) === dirName);
    }
        // 2. 文件夹内cover名图片
    if (!cover ) {
        cover = filesData.find(f => !f.isDir && f.path.startsWith(dirPath) && 
        imgExts.includes(f.name.split('.').pop().toLowerCase()) && 
        f.name.substring(0, f.name.lastIndexOf('.')) === 'cover');
    }
    return cover ? cover.url : null;
}

/**
 * 格式化视频当前播放时间为：时分秒.两位小数（至少6位整数数字，如 000123.45）
 */
function formatVideoTime(seconds) {
    if (isNaN(seconds) || seconds < 0) seconds = 0;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    
    const hStr = String(h).padStart(2, '0');
    const mStr = String(m).padStart(2, '0');
    const sStr = s.toFixed(2).padStart(5, '0'); // 确保秒数个位前补0（如 "05.20"）
    
    return `${hStr}${mStr}${sStr}`; // 格式：HHMMSS.ss
}

/**
 * 格式化实际系统当前时间为：时分秒.两位小数（6位整数数字，如 143015.82）
 */
function formatRealTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const sStr = String(now.getSeconds()).padStart(2, '0');
    
    return `${h}${m}${sStr}`; // 格式：HHMMSS
}



// 截取视频当前帧核心函数（保留 3 个完整参数，排队上传）
function captureVideoFrame(video, fileName, token) {
    if (!video || video.readyState < 2) {
        showToast('⚠️ 视频尚未就绪，无法截取当前帧');
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const baseName = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
// 1. 视频当前时分秒 (如 "000123.45")
    const videoTimeStr = formatVideoTime(video.currentTime);
    // 2. 实际系统当前时分秒 (如 "143015")
    const realTimeStr = formatRealTime();

    const snapName = `${baseName}_${videoTimeStr}_${realTimeStr}.png`;

    canvas.toBlob((blob) => {
        if (!blob) {
            showToast('❌ 截图生成失败');
            return;
        }

        const targetToken = token || 'default';
        const uploadFile = new File([blob], snapName, { type: 'image/png' });

        // 激活界面上的上传任务控件
        const btn = document.getElementById('upload-task-btn');
        if (btn && !hasUploadStarted) {
            btn.style.display = 'block';
            hasUploadStarted = true;
        }
        hasViewedFinished = false;

        // 推入全局 uploadQueue 排队上传
        uploadQueue.push({
            file: uploadFile,
            name: snapName,
            size: blob.size,
            status: 'pending',
            loaded: 0,
            targetToken: targetToken,
            targetFolder: '截图保存',
            previewUrl: URL.createObjectURL(blob)
        });
        totalUpFiles++;
        totalUpBytes += blob.size;

        renderUploadList();

        if (!isUploadingTask) {
            startUploadQueue();
        }

        showToast(`📸 已截取当前帧并推入上传队列：${snapName}`);
    }, 'image/png');
}

// 歌词解析与同步播放逻辑
async function loadLyrics(item) {
    const lyricsContainer = document.getElementById('lb-lyrics');
    if (!lyricsContainer) return;
    lyricsContainer.innerText = '';
    currentLrcData = [];

    const mediaFileName = (typeof item === 'object' && item.name) ? item.name : '';
    if (!mediaFileName) {
        lyricsContainer.innerText = '暂无歌词';
        return;
    }

    // 1. 计算同名的 .lrc 文件名
    const targetLrcName = mediaFileName.replace(/\.[^/.]+$/, ".lrc");
    let lrcUrl = '';

    // 2. 从全局 filesData 数组中精准查找同名 .lrc 文件，避免 URL 转码死链
    if (typeof filesData !== 'undefined' && Array.isArray(filesData)) {
        const lrcFile = filesData.find(f => f.name === targetLrcName);
        if (lrcFile) {
            lrcUrl = lrcFile.url || lrcFile.downloadUrl || lrcFile.path || '';
        }
    }

    // 3. 兜底方案：若 filesData 未查到，尝试通过当前 mediaUrl 直接替换后缀
    if (!lrcUrl && item.url) {
        lrcUrl = item.url.replace(/\.[^/.]+$/, ".lrc");
    }

    if (!lrcUrl) {
        lyricsContainer.innerText = '暂无歌词';
        return;
    }

    // 4. 请求并解析歌词文件
    try {
        const res = await fetch(lrcUrl);
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        const text = await res.text();
        currentLrcData = parseLrc(text);
        if (currentLrcData.length === 0) {
            lyricsContainer.innerText = '暂无歌词';
        }
    } catch (e) {
        lyricsContainer.innerText = '暂无歌词';
    }
}

// 支持同一行包含多个时间戳的 LRC 正则解析与时间排序
function parseLrc(lrcText) {
    if (!lrcText) return [];
    
    const lines = lrcText.split('\n');
    const result = [];
    
    // 全局匹配 [mm:ss.xx] 或 [mm:ss.xxx] 时间戳
    const timeRegGlobal = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
    const timeRegSingle = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;

    for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        // 提取该行包含的所有时间戳标记
        const timeMatches = line.match(timeRegGlobal);
        if (!timeMatches) continue;

        // 剥离所有时间戳，提取纯歌词文本
        const lyricText = line.replace(timeRegGlobal, '').trim();

        // 遍历每一个时间戳，绑定同一个歌词文本
        for (const timeStr of timeMatches) {
            const match = timeRegSingle.exec(timeStr);
            if (match) {
                const min = parseInt(match[1], 10);
                const sec = parseInt(match[2], 10);
                const msStr = match[3].padEnd(3, '0');
                const ms = parseInt(msStr, 10);
                const timeInSeconds = min * 60 + sec + ms / 1000;
                
                result.push({ 
                    time: timeInSeconds, 
                    txt: lyricText 
                });
            }
        }
    }

    // 重新按播放时间从小到大（升序）严格排序
    return result.sort((a, b) => a.time - b.time);
}

function syncLyrics(currentTime) {
    const lyricsContainer = document.getElementById('lb-lyrics');
    if (!currentLrcData || currentLrcData.length === 0) return;

    let curTxt = '';
    for (let i = 0; i < currentLrcData.length; i++) {
        if (currentTime >= currentLrcData[i].time) {
            curTxt = currentLrcData[i].txt;
        } else {
            break;
        }
    }
    if (curTxt) lyricsContainer.innerText = curTxt;
}

/**
 * 判断触发目标是否属于“黑色背景区域”
 * （排除了按钮、音视频播放器、控制面板、歌词框等交互控件）
 */
function isBackgroundTarget(target) {
    if (!target) return false;
    // 如果点击在按钮、音视频控件、控制面板、歌词或计数器上，则不视为背景
    const isInteractive = target.closest(
        'button, video, audio, .lb-controls-panel, .lyrics-container, .lb-counter, input, a, .lb-ctrl-btn'
    );
    return !isInteractive;
}
/**
 * 初始化画廊手势监听（包括双击/双触背景退出、滑动切换）
 */
function initGalleryGestures() {
    const lightbox = document.getElementById('lightbox');
    if (!lightbox) return;

    // --- 1. 双击 (PC) / 双触 (移动端) 黑色背景退出画廊 ---
    
    // 移动端双触 (Double-Tap) 检测
    lightbox.addEventListener('touchend', function (e) {
        if (!isBackgroundTarget(e.target)) return;

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;

        // 如果两次点击间隔在 300ms 以内，判定为双触
        if (tapLength < 300 && tapLength > 0) {
            closeGallery(e, true);
            e.preventDefault(); // 阻止缩放等默认双击行为
        }
        lastTapTime = currentTime;
    }, { passive: false });

    // 桌面端/鼠标双击 (Double-Click)
    lightbox.addEventListener('dblclick', function (e) {
        if (isBackgroundTarget(e.target)) {
            closeGallery(e, true);
        }
    });

    // --- 2. 划动 (Swipe) 左右切换媒体/图片 ---

    lightbox.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) { // 仅处理单指触控
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }
    }, { passive: true });

    lightbox.addEventListener('touchend', function (e) {
        if (e.changedTouches.length === 1) {
            touchEndX = e.changedTouches[0].clientX;
            touchEndY = e.changedTouches[0].clientY;
            handleSwipeGesture(e);
        }
    }, { passive: true });
}

/**
 * 划动手势判别逻辑（仅在音视频媒体模式下生效）
 */
function handleSwipeGesture(e) {

// ==== 如果是图片画廊模式，跳过全局划动，交由图片轨道原有的跟手拖拽逻辑处理 ====
    if (typeof currentGalleryMode !== 'undefined' && currentGalleryMode === 'image') {
        return;
    }
    // 忽略在音视频原生进度条、按钮或调节面板上的滑动，避免误触切换
    if (e.target.closest('button, .lb-controls-panel, audio, video, input, .lb-ctrl-btn')) {
        return;
    }

    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;
    const minSwipeDistance = 50; // 触发切换的最小滑动距离 (px)

    // 确保以水平位移为主（|deltaX| > |deltaY|），避免斜向操作误触
    if (Math.abs(deltaX) > minSwipeDistance && Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX < 0) {
            // 向左划动 -> 下一张 / 下一曲
            navigateGallery(1);
        } else {
            // 向右划动 -> 上一张 / 上一曲
            navigateGallery(-1);
        }
    }
}

// 页面加载完成后自动绑定手势监听
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGalleryGestures);
} else {
    initGalleryGestures();
}

// ==================== 页面状态异常与移动端“后退”安全防护 ====================

// 1. 停止当前所有播放中的媒体
function stopAllActiveMedia() {
    const video = document.getElementById('lb-video');
    const audio = document.getElementById('lb-audio');
    
    if (typeof stopAndCleanupMedia === 'function') {
        stopAndCleanupMedia(video);
        stopAndCleanupMedia(audio);
    } else {
        if (video) { video.pause(); video.src = ''; }
        if (audio) { audio.pause(); audio.src = ''; }
    }
}

// 2. 页面生命周期监听（处理强制后退、切后台、关闭标签页）
function initPageLifecycleProtection() {
    // A. 页面卸载/跳页时（移动端后退跳页最常触发）
    window.addEventListener('pagehide', stopAllActiveMedia, { capture: true });
    window.addEventListener('beforeunload', stopAllActiveMedia, { capture: true });

    // B. 页面被冻结 (iOS/Android WebKit 进后台机制)
    window.addEventListener('freeze', stopAllActiveMedia, { capture: true });

    // C. 页面可见性改变（如切到后台或切屏）
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            // 如果希望切后台时暂停播放，取消下行注释即可：
            // stopAllActiveMedia();
        }
    });

    // D. 监听浏览器/手机原生的“后退”按钮 (popstate)
    window.addEventListener('popstate', function(e) {
        const lightbox = document.getElementById('lightbox');
        // 如果点击后退时画廊处于打开状态，截断后退行为，优先关闭画廊
        if (lightbox && lightbox.style.display !== 'none') {
            stopAllActiveMedia();
            lightbox.style.display = 'none';
        }
    });
}

// 3. 为画廊叠加 History State（让手机“后退键”变成“关闭画廊”）
// 建议在 openGallery 和 openMediaGallery 函数的末尾加上这行代码：
function pushGalleryHistoryState() {
    if (!history.state || !history.state.lightboxOpen) {
        history.pushState({ lightboxOpen: true }, '', location.href);
    }
pushGalleryHistoryState();
}

// 4. DOM 异常显示监控（防止 DOM 被隐式隐藏但声音仍在播放）
function initLightboxObserver() {
    const lightbox = document.getElementById('lightbox');
    if (!lightbox) return;

    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                // 如果画廊被设为了隐藏，强制停止媒体
                if (lightbox.style.display === 'none') {
                    stopAllActiveMedia();
                }
            }
        });
    });

    observer.observe(lightbox, { attributes: true });
}

// 执行初始化
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        initPageLifecycleProtection();
        initLightboxObserver();
    });
} else {
    initPageLifecycleProtection();
    initLightboxObserver();
}

// 【新增】1. 监听画廊多媒体播放进度，动态触发保活，防止长视频断线
window.addEventListener('DOMContentLoaded', () => {
    const mediaElements = [document.getElementById('lb-video'), document.getElementById('lb-audio')];
    mediaElements.forEach(media => {
        if (media) {
            // timeupdate 在播放时会高频触发
            media.addEventListener('timeupdate', () => {
                if (!media.paused && !media.ended) {
                    // resetTimer 内部已经自带了 >150秒不触发 以及 15秒防抖 限制
                    resetTimer(); 
                }
            });
        }
    });
});






</script>
